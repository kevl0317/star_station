<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>界面组件 · 星际信号站</title>
<link rel="stylesheet" href="./src/theme.css"><link rel="stylesheet" href="./src/cards.css"><link rel="stylesheet" href="./src/screens.css">
<style>
  body{overflow:auto;background:var(--night-900) url('./assets/galaxy-pastel.webp') center/cover fixed}
  main{max-width:1120px;margin:auto;padding:32px 20px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}
  header h1{margin:0;font-size:28px;letter-spacing:.08em}
  header a{color:var(--ink-soft);font-weight:700}
  section{margin-top:22px;padding:22px;border-radius:var(--r-lg);background:var(--grain) 0 0/360px,var(--paper-deep);border:1px solid var(--line)}
  section>h2{margin:0 0 16px;font-size:18px;letter-spacing:.1em;color:var(--moon)}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  .swatch{width:132px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);font-size:12px}
  .swatch i{display:block;height:54px}.swatch span{display:block;padding:8px 10px;background:rgba(0,0,0,.25)}
  .swatch b{display:block;font-size:13px}
  .type p{margin:6px 0}
  .kit-icons svg{width:26px;height:26px;color:var(--ink)}
  .kit-stars svg{width:64px;height:64px}.kit-badges svg{width:96px;height:106px}
  .kit-pills .judgment{position:static;opacity:1;transform:none}
  .kit-porthole{width:220px}
  .kit-card{max-width:520px}
</style>
<main>
  <header><h1>界面组件</h1><a href="./">返回游戏 →</a></header>
  <p style="color:var(--ink-soft)">与游戏共用 theme.css / cards.css / screens.css 与 art.mjs，规范说明见 DESIGN.md。</p>
  <section><h2>色彩</h2><div class="row" id="swatches"></div></section>
  <section class="type"><h2>文字</h2>
    <p style="font:900 var(--fs-hero)/1.3 var(--font-display)">接收信号，<span style="color:var(--moon)">点亮星空。</span></p>
    <p style="font:900 var(--fs-3xl)/1.4 var(--font-display)">标题 · 信号接通</p>
    <p style="font:800 var(--fs-xl)/1.6 var(--font-body)">规则 · 只点蓝色圆形</p>
    <p style="font:600 var(--fs-lg)/1.9 var(--font-body)">正文 · 月球是目前唯一一个长期、稳定地绕地球运行的天然天体。</p>
    <p style="font:700 var(--fs-sm)/1.6 var(--font-body);color:var(--ink-mute)">辅助 · 每关最多 3 颗星，25 关共 75 颗</p>
    <p style="font:900 46px/1 var(--font-num)">100 <small style="font-size:14px;color:var(--ink-mute)">数字</small></p>
  </section>
  <section><h2>按钮与标签</h2><div class="row">
    <button class="action-button gold" id="kit-gold"></button>
    <button class="action-button outline" id="kit-outline"></button>
    <button class="action-button gold" disabled>先完成练习</button>
    <button class="text-button">文字按钮</button>
    <button class="back-button">返回主页</button>
    <span class="chip">第5关</span><span class="chip card-kind explore">真实探索</span>
    <span class="rule-label">只点</span>
  </div></section>
  <section class="kit-pills"><h2>反馈</h2><div class="row" id="pills"></div></section>
  <section><h2>星星与纪念章</h2><div class="row kit-stars" id="stars"></div><div class="row kit-badges" id="badges" style="margin-top:14px"></div></section>
  <section><h2>图标</h2><div class="row kit-icons" id="icons"></div></section>
  <section><h2>舷窗与知识卡</h2><div class="row" style="align-items:flex-start;gap:40px">
    <div class="briefing-porthole kit-porthole"><div id="briefing-tower"></div></div>
    <div class="kit-card" id="card"></div>
  </div></section>
</main>
<script type="module">
import { brandMark, starSVG, badgeSVG, icon, icons } from "./src/art.mjs";
import { planetSVG, cardHTML } from "./src/astronomy.mjs";
const tokens = [["--night-900","夜空底"],["--night-700","纸面"],["--night-500","描边"],["--ink","正文"],["--ink-soft","次要文字"],["--moon","月牙金 · 主操作"],["--leaf","正确"],["--ribbon","错误 · 丝带红"],["--sky","信息"]];
const css = getComputedStyle(document.documentElement);
document.getElementById("swatches").innerHTML = tokens.map(([t, n]) => `<div class="swatch"><i style="background:var(${t})"></i><span><b>${n}</b>${t} ${css.getPropertyValue(t).trim()}</span></div>`).join("")
  + ["#85dce9","#edc994","#efad92","#d5c3ad","#b3bbed"].map((c, i) => `<div class="swatch"><i style="background:${c}"></i><span><b>第${i + 1}章</b>${c}</span></div>`).join("");
document.getElementById("kit-gold").innerHTML = `开始旅程<b>${icon("play")}</b>`;
document.getElementById("kit-outline").innerHTML = `星图图鉴<b>${icon("book")}</b>`;
document.getElementById("pills").innerHTML = `<div class="judgment visible">${icon("check")}<span>接收成功</span></div><div class="judgment visible error">${icon("close")}<span>颜色不符</span></div><div class="combo visible"><small>连续正确</small><b>6</b></div>`;
document.getElementById("stars").innerHTML = brandMark() + starSVG(true) + starSVG(true) + starSVG(false);
document.getElementById("badges").innerHTML = [0, 1, 2, 3, 4].map((i) => badgeSVG(i, true)).join("") + badgeSVG(4, false);
document.getElementById("icons").innerHTML = Object.keys(icons).map((n) => `<span title="${n}">${icon(n)}</span>`).join("");
document.getElementById("briefing-tower").innerHTML = planetSVG("saturn");
document.getElementById("card").innerHTML = cardHTML(19, { narrated: true });
</script>
</html>
