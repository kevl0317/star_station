<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部飞行信号 · 星际信号站</title>
<style>*{box-sizing:border-box}body{margin:0;background:#132644 url('./assets/galaxy-pastel.png') center/cover fixed;color:#fff;font-family:system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px}a{color:#fff3c8}nav{position:sticky;top:0;z-index:1;display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:#132644ed;border-radius:12px}button{background:#263f58;border:1px solid #7893ad;border-radius:18px;color:white;padding:8px 16px;cursor:pointer}button.active{background:#f0d496;color:#17253a}h2{font-size:20px;margin:32px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:12px}.tile{margin:0;text-align:center;background:#102038a6;border-radius:12px;padding:12px 4px}.tile svg{display:block;width:90px;height:90px;margin:auto}.tile figcaption{font-size:12px;line-height:1.6;color:#e3ebef}p{color:#bccddf}h1,h2{text-shadow:0 2px 4px #000}[hidden]{display:none!important}</style>
<main><header><h1>全部飞行信号</h1><a href="/">返回游戏</a></header><p id="count"></p><nav id="filters"></nav><div id="catalog"></div></main>
<script type="module">
import {signalSVG,signalName} from './src/art.mjs';
import {LEVELS,signalPool,COLOR_NAMES} from './src/levels.mjs';
const unique=new Map();for(const l of LEVELS)for(const s of signalPool(l)){const item={color:s.color,shape:s.shape,solid:s.solid!==false,halo:!!s.halo,direction:s.shape==='triangle'?(s.direction||'up'):'up'};unique.set(JSON.stringify(item),item)}
const signals=[...unique.values()];const colors=[...new Set(signals.map(s=>s.color))];let selected='all';
function render(){document.getElementById('filters').innerHTML=['all',...colors].map(c=>'<button data-color="'+c+'" class="'+(c===selected?'active':'')+'">'+(COLOR_NAMES[c]||'全部')+'</button>').join('');const list=signals.filter(s=>selected==='all'||s.color===selected);document.getElementById('count').textContent='游戏中实际使用的 '+list.length+' 种组合 · 与游戏共用实时美术，包含最新缩小的圆形';document.getElementById('catalog').innerHTML=[[true,false,'实心'],[false,false,'空心'],[true,true,'实心 · 带光环'],[false,true,'空心 · 带光环']].map(([solid,halo,title])=>{const group=list.filter(s=>s.solid===solid&&s.halo===halo);return group.length?'<section><h2>'+title+'</h2><div class="grid">'+group.map(s=>'<figure class="tile">'+signalSVG(s)+'<figcaption>'+signalName(s).replace('信号','')+'</figcaption></figure>').join('')+'</div></section>':''}).join('')}
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('button');if(b){selected=b.dataset.color;render()}});render();
</script></html>
